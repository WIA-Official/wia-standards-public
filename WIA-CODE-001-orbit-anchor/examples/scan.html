<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest-scan.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WIA Scan">
<title>WIA Code Scanner</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-2: #1c2027;
    --accent: #00e6a0;
    --accent-2: #ffd400;
    --danger: #ff5f5f;
    --text: #eef2f5;
    --text-dim: #9aa4ad;
    --border: #2a2f37;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
      "Malgun Gothic", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    height: 100%;
    height: 100dvh;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px calc(10px + env(safe-area-inset-top)) 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
    z-index: 10;
  }
  .topbar h1 {
    font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.2px;
  }
  .topbar .proto { color: var(--text-dim); font-weight: 400; font-size: 13px; }
  .badge {
    font-size: 10px; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--border);
    letter-spacing: 0.3px; white-space: nowrap;
  }
  .badge-real { color: #06261c; background: var(--accent); border-color: var(--accent); }
  .badge-stub { color: #3a3200; background: var(--accent-2); border-color: var(--accent-2); }

  .screen {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .hidden { display: none !important; }

  /* Start screen */
  #startScreen {
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 16px;
  }
  #startScreen .lead { color: var(--text-dim); font-size: 14px; margin: 0 0 8px; max-width: 320px; }
  .big-btn {
    font-size: 18px; font-weight: 700;
    padding: 18px 40px; border-radius: 16px;
    background: var(--accent); color: #06261c; border: none;
    box-shadow: 0 6px 20px rgba(0,230,160,0.25);
    cursor: pointer;
  }
  .big-btn:active { transform: scale(0.98); }
  .big-btn:disabled { opacity: 0.5; box-shadow: none; }
  .msg { color: var(--text-dim); font-size: 13px; min-height: 18px; margin-top: 4px; }
  .msg.error { color: var(--danger); white-space: pre-line; }
  .perm-blocked {
    margin-top: 4px; max-width: 320px;
    background: rgba(255,95,95,0.08); border: 1px solid rgba(255,95,95,0.35);
    border-radius: 12px; padding: 14px 16px;
    text-align: left;
  }
  .perm-blocked-title { margin: 0 0 6px; font-size: 14px; font-weight: 700; color: var(--danger); }
  .perm-blocked-text { margin: 0; font-size: 13px; color: var(--text-dim); line-height: 1.5; white-space: pre-line; }
  .perm-recheck-btn {
    margin-top: 10px; font-size: 13px; font-weight: 700;
    padding: 8px 14px; border-radius: 8px;
    background: transparent; color: var(--text); border: 1px solid var(--border);
    cursor: pointer;
  }
  /* ★2026-08-14: 카메라 앱의 QR인식 미리보기 웹뷰로 들어오면 카메라 API 자체가 막혀있는 경우가 많다
     (getUserMedia가 응답 없이 pending — 8초 타임아웃 전까진 화면에 아무 변화도 없어 보인다). 실패를
     기다리게 하지 않고 처음부터 눈에 띄는 탈출구를 준다: 클립보드 복사는 이런 제한된 웹뷰에서도
     대체로 동작한다. */
  .copy-link-btn {
    margin-top: 14px; font-size: 13px;
    padding: 8px 14px; border-radius: 8px;
    background: transparent; color: var(--text-dim); border: 1px dashed var(--border);
    cursor: pointer;
  }
  .copy-link-btn:active { color: var(--text); }

  /* Camera screen */
  #cameraScreen { min-height: 0; }
  .video-wrap {
    position: relative; flex: 1 1 auto; min-height: 0;
    background: #000; overflow: hidden;
  }
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  #overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .hud {
    position: absolute; top: 10px; left: 10px;
    display: flex; gap: 8px;
    font-size: 11px; font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,0.55); color: var(--text);
    padding: 5px 9px; border-radius: 8px;
    pointer-events: none;
  }
  .hint {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: var(--text-dim);
    padding: 8px 14px; border-radius: 999px; font-size: 13px;
    pointer-events: none; white-space: nowrap;
  }
  .controls {
    flex: 0 0 auto;
    display: flex; gap: 10px; padding: 12px 14px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--border);
  }
  .ctrl-btn {
    flex: 1; font-size: 15px; font-weight: 600;
    padding: 14px 10px; border-radius: 12px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    cursor: pointer;
  }
  .ctrl-btn:active { transform: scale(0.98); }
  .ctrl-btn.primary { background: var(--accent); color: #06261c; border-color: var(--accent); }

  /* Test-code screen */
  #testScreen { background: #fff; color: #111; }
  .test-wrap {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    background: #fff; padding: 20px;
  }
  .test-wrap img {
    max-width: 100%; max-height: 100%; image-rendering: pixelated;
  }
  #testScreen .controls {
    background: #f2f2f2; border-top: 1px solid #ddd;
  }
  .grid-select { display: flex; gap: 6px; }
  .grid-btn {
    font-size: 14px; font-weight: 700; width: 44px; height: 44px;
    border-radius: 10px; border: 1px solid #ccc; background: #fff; color: #333;
    cursor: pointer;
  }
  .grid-btn.active { background: #111; color: #fff; border-color: #111; }
  #testScreen #closeTestBtn {
    background: #111; color: #fff; border-color: #111;
  }

  /* Install banner (PWA) */
  .install-banner {
    position: absolute; left: 10px; right: 10px; top: 54px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(20,23,28,0.94); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 10px 10px 12px;
    font-size: 12.5px; color: var(--text);
    z-index: 20;
  }
  .install-banner p { margin: 0; flex: 1; line-height: 1.4; }
  .install-banner button {
    font-size: 12.5px; font-weight: 700; padding: 8px 12px; border-radius: 8px;
    border: none; cursor: pointer; white-space: nowrap;
  }
  .install-banner #installBtn { background: var(--accent); color: #06261c; }
  .install-banner #installDismissBtn {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 8px 10px;
  }

  /* 해독된 내용이 URL일 때만 뜨는 "열기" 버튼 — 자동이동 금지, 탭해야만 이동 */
  #openUrlBtn {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 25;
    font-size: 14px; font-weight: 700;
    padding: 11px 22px; border-radius: 999px;
    background: var(--accent); color: #06261c; border: none;
    box-shadow: 0 4px 16px rgba(0,230,160,0.35);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  #openUrlBtn:active { transform: translateX(-50%) scale(0.97); }

  /* Error screen */
  #errorScreen {
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; gap: 14px;
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>WIA Code Scanner</h1>
    <span id="engineBadge" class="badge badge-stub">ENGINE: …</span>
  </header>

  <section id="startScreen" class="screen">
    <p class="lead">설치 없이 브라우저로 우리 차세대 코드를 읽습니다.</p>
    <button id="startBtn" class="big-btn" disabled>카메라 시작</button>
    <p id="startMsg" class="msg">엔진 로딩 중…</p>
    <button id="copyLinkBtn" type="button" class="copy-link-btn">카메라 앱 미리보기에서 안 열리면 → 주소 복사</button>
    <div id="permBlocked" class="perm-blocked hidden">
      <p class="perm-blocked-title">🚫 카메라 권한이 차단돼 있어요</p>
      <p id="permBlockedText" class="perm-blocked-text"></p>
      <button id="permRecheckBtn" type="button" class="perm-recheck-btn">권한 바꿨어요, 다시 확인</button>
    </div>
  </section>

  <section id="cameraScreen" class="screen hidden">
    <div class="video-wrap" id="videoWrap">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div class="hud">
        <span id="hudFps">FPS --</span>
        <span id="hudMs">-- ms</span>
      </div>
      <div id="hint" class="hint hidden">코드를 화면 안에 비춰주세요</div>
      <div id="installBanner" class="install-banner hidden">
        <p id="installBannerText"></p>
        <button id="installBtn" type="button">추가</button>
        <button id="installDismissBtn" type="button" aria-label="닫기">✕</button>
      </div>
      <button id="openUrlBtn" type="button" class="hidden">🔗 열기</button>
    </div>
    <div class="controls">
      <button id="stopBtn" class="ctrl-btn">정지</button>
      <button id="testToggleBtn" class="ctrl-btn">테스트 코드 보기</button>
    </div>
  </section>

  <section id="testScreen" class="screen hidden">
    <div class="test-wrap">
      <img id="testImg" alt="테스트 코드">
    </div>
    <div class="controls">
      <div class="grid-select">
        <button data-grid="S" class="grid-btn active">S</button>
        <button data-grid="M" class="grid-btn">M</button>
        <button data-grid="L" class="grid-btn">L</button>
      </div>
      <button id="closeTestBtn" class="ctrl-btn">닫기</button>
    </div>
  </section>

  <section id="errorScreen" class="screen hidden">
    <p id="errorMsg" class="msg error"></p>
    <button id="retryBtn" class="big-btn">다시 시도</button>
  </section>
</div>

<script src="wiascan-core.js" onerror="/* fall back to stub during dev */"></script>
<script src="scan.js"></script>
<script src="sitekit-v2.js"></script>
</body>
</html>
